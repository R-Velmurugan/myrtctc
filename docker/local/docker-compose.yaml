services:
  postgres:
    image: postgres:16-alpine
    container_name: myrctc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myrctc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack:latest
    container_name: myrctc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    networks:
      - myrctc-network
    volumes:
      - redis_data:/data

networks:
  myrctc-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

